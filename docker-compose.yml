
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tracker}
      MYSQL_USER: ${MYSQL_USER:-tracker}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-trackerpassword}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  discovery-server:
    build: ./discovery-server
    ports:
      - "8761:8761"

  application-service:
    build: ./application-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-tracker}
      DB_USER: ${MYSQL_USER:-tracker}
      DB_PASSWORD: ${MYSQL_PASSWORD:-trackerpassword}
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    ports:
      - "8081:8081"

  user-service:
    build: ./user-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-tracker}
      DB_USER: ${MYSQL_USER:-tracker}
      DB_PASSWORD: ${MYSQL_PASSWORD:-trackerpassword}
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    ports:
      - "8082:8082"

  api-gateway:
    build: ./api-gateway
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
      - application-service
      - user-service
    ports:
      - "8080:8080"

volumes:
  mysql_data:
